[package]
name = "rcs-filter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
alloy-primitives.workspace = true
alloy-dyn-abi.workspace = true
alloy-sol-types.workspace = true
tokio = { workspace = true }
reqwest = { workspace = true, features = ["query"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
futures-util.workspace = true
reth-metrics.workspace = true
metrics.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
metrics-util.workspace = true
tracing-subscriber = "0.3"

[features]
default = []

# Non-default. Exposes the crate's in-process test helpers to a *dependent* crate's test code
# without compiling them into a production build: a dependency's `cfg(test)` is inactive when
# this crate is compiled as a dependency, so `#[cfg(test)]` alone cannot reach consumers' tests.
# Downstream crates enable it from `[dev-dependencies]`, so the helpers are available to their
# test/bench targets only — never to a release artifact of this crate or of its consumers.
test-utils = []

[lints]
workspace = true
