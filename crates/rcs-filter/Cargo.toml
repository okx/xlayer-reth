[package]
name = "rcs-filter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
# Test files live in `tests/` but are NOT Cargo integration tests: every one of them is
# attached to its production parent module with `#[path]`, so it keeps private access and its
# module path. With Cargo's auto-discovery each `tests/*.rs` would ALSO be compiled as a
# separate crate and fail (`too many leading super keywords`). A new test or helper file must
# therefore be declared from its parent with `#[path]`; it is never picked up implicitly.
autotests = false

[dependencies]
alloy-primitives.workspace = true
alloy-dyn-abi.workspace = true
alloy-sol-types.workspace = true
tokio = { workspace = true }
reqwest = { workspace = true, features = ["query"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
futures-util.workspace = true
reth-metrics.workspace = true
metrics.workspace = true
# Used only by the `capture` module (the moved capture inspector). It names no concrete EVM type:
# the EVM-generic surface stays free of `alloy-op-evm`/`op-revm`.
revm.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
metrics-util.workspace = true
tracing-subscriber = "0.3"
# Test-only dependencies of the moved capture tests: they drive the production inspector through
# a real `alloy_op_evm::OpEvm` built by the same factory the flashblocks path uses. Keeping them
# in `[dev-dependencies]` is what keeps the normal dependency graph EVM-agnostic.
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-evm.workspace = true
alloy-op-evm.workspace = true
op-revm.workspace = true

[features]
default = []

# Non-default. Exposes this crate's in-process test seams — screening helpers AND the capture
# module's seams — to a *dependent* crate's test code without compiling them into a production
# build: a dependency's `cfg(test)` is inactive when this crate is compiled as a dependency, and
# `pub(crate)` does not cross a crate boundary, so `#[cfg(test)]` alone cannot reach consumers'
# tests. Downstream crates enable it from `[dev-dependencies]`, so the seams are available to
# their test/bench targets only — never to a release artifact of this crate or of its consumers.
test-utils = []

[lints]
workspace = true
