[package]
name = "xlayer-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
# Opens this crate's own capture/observation handling to a test in another crate, so the
# equal-identification comparison across the three execution paths drives the real code rather
# than a copy of it. Non-default and never enabled from `[dependencies]`, so it is absent from
# every production build.
test-utils = []

[dependencies]
reth-optimism-rpc.workspace = true
reth-rpc.workspace = true
reth-rpc-eth-api.workspace = true

reth-chain-state.workspace = true
reth-evm.workspace = true
reth-optimism-evm.workspace = true
reth-optimism-primitives.workspace = true
reth-rpc-server-types.workspace = true
reth-storage-api.workspace = true

alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-evm.workspace = true
alloy-op-evm.workspace = true
alloy-primitives.workspace = true
op-alloy-consensus.workspace = true
op-alloy-network.workspace = true
op-revm.workspace = true

rcs-filter.workspace = true
xlayer-rcs-capture.workspace = true

jsonrpsee.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
revm.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
# Enable the shared capture crate's non-default seams for THIS crate's test targets only; the
# feature is deliberately absent from `[dependencies]`, so a production build compiles none of it.
xlayer-rcs-capture = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true
